<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Quan hệ giữa complete và consistent</title>
  <desc id="desc">Ma trận bốn trường hợp của phép gán theo hai tiêu chí đầy đủ và nhất quán. Chỉ trường hợp cả hai đều đúng là nghiệm CSP.</desc>
  <rect width="760" height="430" rx="18" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Khi nào một assignment là nghiệm CSP?</text>

  <text x="440" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">consistent()</text>
  <text x="330" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475467">False</text>
  <text x="560" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475467">True</text>
  <text x="52" y="245" text-anchor="middle" transform="rotate(-90 52 245)" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">complete()</text>
  <text x="105" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475467">False</text>
  <text x="105" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475467">True</text>

  <rect x="150" y="115" width="360" height="115" rx="10" fill="#fff4e5" stroke="#f2b35d"/>
  <rect x="520" y="115" width="190" height="115" rx="10" fill="#eef4ff" stroke="#84adff"/>
  <rect x="150" y="240" width="360" height="115" rx="10" fill="#feecec" stroke="#ef8b8b"/>
  <rect x="520" y="240" width="190" height="115" rx="10" fill="#e7f7ef" stroke="#52b788" stroke-width="2"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="330" y="148" font-size="16" font-weight="700" fill="#8a4b08">Gán chưa đủ và đã có lỗi</text>
    <text x="330" y="177" font-size="14" fill="#69410f">Một số đỉnh chưa có màu;</text>
    <text x="330" y="199" font-size="14" fill="#69410f">các đỉnh đã gán có xung đột</text>

    <text x="615" y="148" font-size="16" font-weight="700" fill="#2459a9">Gán từng phần hợp lệ</text>
    <text x="615" y="177" font-size="14" fill="#344e78">Chưa có xung đột,</text>
    <text x="615" y="199" font-size="14" fill="#344e78">nhưng chưa gán đủ</text>

    <text x="330" y="273" font-size="16" font-weight="700" fill="#a52f2f">Gán đầy đủ nhưng sai</text>
    <text x="330" y="302" font-size="14" fill="#7a3434">Mọi đỉnh đã có màu,</text>
    <text x="330" y="324" font-size="14" fill="#7a3434">nhưng còn cạnh cùng màu</text>

    <text x="615" y="273" font-size="17" font-weight="700" fill="#176b49">NGHIỆM CSP</text>
    <text x="615" y="302" font-size="14" fill="#245c47">Đầy đủ</text>
    <text x="615" y="324" font-size="14" fill="#245c47">và nhất quán</text>
  </g>

  <rect x="175" y="382" width="410" height="31" rx="15" fill="#172033"/>
  <text x="380" y="403" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">is_solution = complete AND consistent</text>
</svg>
